                    **Behaviour**:

                    Find products to show on the product page, cart page, or slide-out cart from a single recommendation. Returned products are defined by the entries of the *sources* array within a given *requests* array entry. *sources* is an array of objects, where each object represents an algorithm step that accepts a number of properties to further narrow the product scope of that specific algorithm step.

                    In this example we are fetching products to show on the product page, cart page, or slide-out cart page from a single recommendation. Unmanaged recommendation requests meant to be shown on the product page, cart page, or slide-out cart require either a *productNumbers* or *urls* array to exist in the *context* object of each request entry. The *productNumbers* or *urls* array serves to ensure that the recommendation being requested knows which product page it should find products in relation to.

                    **Explanation of important properties to surface to the user**:

                    - **websiteUuid**: Required property in Unmanaged recommendation requests, which helps the Hello Retail recommendation system understand which Hello Retail dashboard the request should point to.

                    - **trackingUserId**: This is commonly derived from a cookie by the name of "hello_retail_id" which is automatically set by the Hello Retail SDK being initialized on the frontend. The trackingUserId is utilized to personalize responses and attribute personalization to the user. Integrations seeking to avoid the frontend Hello Retail SDK can manually create and manage trackingUserId's through the following documentation: https://developer.helloretail.com/sdk/tracking/tracking_user/#getting-the-trackinguserid-using-the-rest-api

                    - **requests**: This is the request array where you specify the recommendation configurations from the Hello Retail dashboard that you want to derive products from. Each individual request entry in the *requests* array must be an object with at least a *key* property.

                    - **trackingKey**: Required property in Unmanaged recommendation requests, which specify under what name the resulting analytics from this recommendation should be stored under, in the Hello Retail dashboard.

                    - **fields**: Specify which properties you want returned on each product. Properties must be mapped through the Hello Retail ETL in the Hello Retail dashboard. It is not necessary to index properties through the Hello Retail *Data fields* section.

                    - **hideAdditionalVariants**: A property that controls whether more than one product from the same grouping key can be returned.

                    - **count**: A property that controls how many products in total this recommendation is allowed to return across all of the listed algorithm entries.

