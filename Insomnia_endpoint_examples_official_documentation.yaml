                #conversion-tracking

                **Behaviour**:

                Informs the Hello Retail system of a completed purchase.

                The customer has just completed their purchase, and are now being directed to the "thank you for your purchase" page. This should trigger a conversion tracking request towards Hello Retail, including the customers *trackingUserId*.

                **Explanation of important properties to surface to the user**:

                - **trackingUserId**: This is commonly derived from a cookie by the name of "hello_retail_id" which is automatically set by the Hello Retail SDK being initialized on the frontend. The trackingUserId is utilized to personalize responses and attribute personalization to the user. Integrations seeking to avoid the frontend Hello Retail SDK can manually create and manage trackingUserId's through the following documentation: https://developer.helloretail.com/sdk/tracking/tracking_user/#getting-the-trackinguserid-using-the-rest-api

                - **websiteUuid**: Required property in conversion tracking requests, which helps the Hello Retail system understand which Hello Retail dashboard the request should point to.

                - **total**: The total value of the combined conversion.

                - **orderNumber**: Unique order number for this conversion. Must be identical to the order number provided in any order feeds.

                - **email**: Email address of the customer making the order.

                - **products[]**: Array of products, where each different product is its own object entry.

                - **products[].productNumber**: Unique identifier Hello Retail can utilize to determine what product this is.

                - **products[].url**: Unique identifier Hello Retail can utilize to determine what product this is.

                - **products[].quantity**: Information about how many of a given product was purchased.

                - **products[].lineTotal**: Total cost of each product entry.

