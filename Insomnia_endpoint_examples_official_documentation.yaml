                **Claude Skill**:

                #customer-bias

                **Behaviour**:

                Returns the bias of the customer, based on the specified *fields*, weighted relatively to each other, for the supplied *customerId*

                **Explanation of important properties to surface to the user**:

                - **customerId**: (*Using customerId in the customerBias request require an apiKey querystring parameter to be present. Read more here*: https://support.helloretail.com/general-setup/hello-retail-api/#website-uuid-and-api-key-in-the-dashboard) A customerId is a bundling of individual trackingUserId's, on a singular customer-representing id from your own internal system. A customer might have different trackingUserId's on desktop and mobile, making Hello Retail interpret their two sessions as different customers. You now want both the desktop and mobile session of this user to be treated as the same user. The solution is to utilize the customerId system which you can read more about here https://developer.helloretail.com/sdk/tracking/set_custom_id_on_tracking_user/.
              sortKey: -1725270819453
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                			"websiteUuid": "d364dcdc-e618-45bd-b395-8653579884fe",
                			"customerId": "53967",
                			"fields": ["brand", "extraDataList.tags"],
                			"numberOfValues": 2
                }
