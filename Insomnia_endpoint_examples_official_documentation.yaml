            children:
              - url: https://core.helloretail.com/serve/recoms
                name: Find products to show on a front page or 404 page [Multiple recommendation
                  - no context data]
                meta:
                  id: req_5a4b1f59eea2441494a6ab8286666722
                  created: 1731336495084
                  modified: 1783343943799
                  isPrivate: false
                  description: |-
                    **Claude Skill**:

                    #recommendations

                    **Behaviour**:

                    Find products to show on the front page or 404 page from multiple recommendations. Returned products are defined by the entries of the *sources* array within a given *requests* array entry. *sources* is an array of objects, where each object represents an algorithm step that accepts a number of properties to further narrow the product scope of that specific algorithm step.

                    In this example we are fetching products to show on the front page or 404 page from multiple recommendations. Unmanaged recommendation requests meant to be shown on the front page or 404 page typically require no data forwarded as part of the *context* object, because the typical front page or 404 page recommendation configuration does not need to show products that relate to certain product (such as a product page recommendation), or adhere to a specific category id (such as a category page recommendation).

                    **Explanation of important properties to surface to the user**:

                    - **websiteUuid**: Required property in Unmanaged recommendation requests, which helps the Hello Retail recommendation system understand which Hello Retail dashboard the request should point to.

                    - **trackingUserId**: This is commonly derived from a cookie by the name of "hello_retail_id" which is automatically set by the Hello Retail SDK being initialized on the frontend. The trackingUserId is utilized to personalize responses and attribute personalization to the user. Integrations seeking to avoid the frontend Hello Retail SDK can manually create and manage trackingUserId's through the following documentation: https://developer.helloretail.com/sdk/tracking/tracking_user/#getting-the-trackinguserid-using-the-rest-api

                    - **requests**: This is the request array where you specify the recommendation configurations from the Hello Retail dashboard that you want to derive products from. Each individual request entry in the *requests* array must be an object with at least a *key* property.

                    - **trackingKey**: Required property in Unmanaged recommendation requests, which specify under what name the resulting analytics from this recommendation should be stored under, in the Hello Retail dashboard.

                    - **fields**: Specify which properties you want returned on each product. Properties must be mapped through the Hello Retail ETL in the Hello Retail dashboard. It is not necessary to index properties through the Hello Retail *Data fields* section.

                    - **hideAdditionalVariants**: A property that controls whether more than one product from the same grouping key can be returned.

                    - **count**: A property that controls how many products in total this recommendation is allowed to return across all of the listed algorithm entries.

                    - **context**: Supply contextual information that the Hello Retail Recommendation's algorithm steps and filter options can utilize in order to narrow the scope of which products the recommendation is allowed to return.

                    - **sources**: Array of algorithm entries for the recommendation to consider.

                    - **type**: Specify the desired algorithm for the given entry. See available algorithm specifications here https://developer.helloretail.com/api/recoms/#product-source-types

                    - **limit**: Specify desired limit on how many products a given algorithm entry is allowed to return.
                  sortKey: -1724674502325
                method: POST
                body:
                  mimeType: application/json
                  text: |-
                    {
                    		"websiteUuid":"d364dcdc-e618-45bd-b395-8653579884fe",
