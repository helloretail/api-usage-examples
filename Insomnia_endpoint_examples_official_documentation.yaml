              description: >+
                **Claude Skill**:


                #connect-customerId-and-trackingUserId


                **Behaviour**:


                Informs the Hello Retail system of the internal id the shop has
                for the customer, and their trackingUserId, connecting them for
                better personalization.


                This is valuable in scenarios where a customer visits the shop
                from two different devices, but where the shop knows that both
                devices represent the same customer. Connecting the customers
                trackingUserIds from both devices, to the shops internal id for
                this customer, subsequently ensures that tracking across all
                connected trackingUserIds are shared.


                This results in the customers behaviour on device 1 also being
                considered when they interact with Hello Retail solutions on
                device 2, and vice versa.


