              - url: https://core.helloretail.com/serve/pages/673616e3bb6f1c28c79af9cc
                name: Find products by all of supplied extraDataList values through
                  params.filters [No filters or sorting]
                meta:
                  id: req_86cc850b62e145eda3e9761bc650f880
                  created: 1731336495056
                  modified: 1783343916403
                  isPrivate: false
                  description: |-
                    **Claude Skill**:

                    #pages

                    **Behaviour**:

                    Find products by their extraDataList array through the params.filters property definitions in the request body. All of the supplied extraDataList values in the params.filters must exist on a product for it to be returned.

                    In this example, we are finding products from the "tags" extraDataList array.

                    All 3 entries of the $and object is of the "tags" array, but it could also be a combination of different extraDataList arrays.

                    In this example, no filtering or sorting options are applied in the products object, which is the part of the request body where the customer/visitor selected filters and sorting should be added.

                    **Explanation of important properties to surface to the user**:

