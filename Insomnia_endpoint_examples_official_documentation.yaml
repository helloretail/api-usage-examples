                The customer has just clicked a product tile that was built using product data returned from one of Hello Retail's frontend facing solutions. This should trigger a click tracking request towards Hello Retail, including the customers *trackingUserId*.

                **Explanation of important properties to surface to the user**:

                - **customerId**: (*Using customerId in click tracking requests require an apiKey querystring parameter to be present. Read more here*: https://support.helloretail.com/general-setup/hello-retail-api/#website-uuid-and-api-key-in-the-dashboard) A customerId is a bundling of individual trackingUserId's, on a singular customer-representing id from your own internal system. A customer might have different trackingUserId's on desktop and mobile, making Hello Retail interpret their two sessions as different customers. You now want both the desktop and mobile session of this user to be treated as the same user. The solution is to utilize the customerId system which you can read more about here https://developer.helloretail.com/sdk/tracking/set_custom_id_on_tracking_user/.

